services:
  postgres:
    image: postgres:16-alpine
    container_name: paadel-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: paadel
      POSTGRES_PASSWORD: paadel
      POSTGRES_DB: paadel
    volumes:
      - paadel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paadel -d paadel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: paadel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - paadel-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  paadel-postgres-data:
  paadel-redis-data:
