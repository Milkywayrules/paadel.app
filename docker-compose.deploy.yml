services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paadel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paadel}
      POSTGRES_DB: paadel
    volumes:
      - paadel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paadel -d paadel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - paadel-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    working_dir: /app
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgresql://paadel:${POSTGRES_PASSWORD:-paadel}@postgres:5432/paadel
      ENV_SKIP_VALIDATION: "true"
    restart: "no"

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      APP_ENV: ${APP_ENV:?Set APP_ENV in Doppler or .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN}
      DB_URL: postgresql://paadel:${POSTGRES_PASSWORD:-paadel}@postgres:5432/paadel
      EMAIL_FROM: ${EMAIL_FROM}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GITHUB_ENABLED: ${OAUTH_GITHUB_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PREFIX: ${R2_PREFIX:?Set R2_PREFIX in Doppler or .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_OAUTH_GITHUB_ENABLED: ${NEXT_PUBLIC_OAUTH_GITHUB_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  paadel-postgres-data:
  paadel-redis-data:
